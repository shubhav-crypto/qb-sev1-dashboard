name: Temp Slack Fetch Today

on:
  workflow_dispatch:
    inputs:
      oldest:
        required: true
      latest:
        required: true
      eod_oldest:
        required: true
      eod_latest:
        required: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Slack data
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          OLDEST: ${{ github.event.inputs.oldest }}
          LATEST: ${{ github.event.inputs.latest }}
          EOD_OLDEST: ${{ github.event.inputs.eod_oldest }}
          EOD_LATEST: ${{ github.event.inputs.eod_latest }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os

          token = os.environ["SLACK_TOKEN"]
          oldest = os.environ["OLDEST"]
          latest = os.environ["LATEST"]
          eod_oldest = os.environ["EOD_OLDEST"]
          eod_latest = os.environ["EOD_LATEST"]

          headers = {"Authorization": f"Bearer {token}"}

          def fetch_channel(channel, oldest, latest, limit=100):
              all_messages = []
              cursor = None
              while True:
                  params = {
                      "channel": channel,
                      "oldest": oldest,
                      "latest": latest,
                      "limit": min(limit, 200),
                      "inclusive": "true"
                  }
                  if cursor:
                      params["cursor"] = cursor
                  resp = requests.get(
                      "https://slack.com/api/conversations.history",
                      headers=headers,
                      params=params
                  )
                  data = resp.json()
                  all_messages.extend(data.get("messages", []))
                  meta = data.get("response_metadata", {})
                  cursor = meta.get("next_cursor", "")
                  if not cursor or len(all_messages) >= limit:
                      break
              return all_messages

          def fetch_thread(channel, thread_ts):
              resp = requests.get(
                  "https://slack.com/api/conversations.replies",
                  headers=headers,
                  params={"channel": channel, "ts": thread_ts, "limit": 50}
              )
              return resp.json().get("messages", [])

          # Debug: test auth first
          r = requests.get("https://slack.com/api/auth.test", headers=headers)
          print("Auth test:", r.json().get("ok"), r.json().get("user"), r.json().get("error"))

          # Debug: try wider window for today
          r2 = requests.get("https://slack.com/api/conversations.history",
              headers=headers,
              params={"channel": "C02K54WLXM2", "oldest": "1794153600", "latest": "1794239999", "limit": "5"})
          d2 = r2.json()
          print(f"Wide window test: ok={d2.get('ok')}, msgs={len(d2.get('messages', []))}, error={d2.get('error')}")

          alerts = fetch_channel("C02K54WLXM2", oldest, latest)
          print(f"Alerts: {len(alerts)} messages")

          import re
          threads = {}
          case_msgs = []
          for msg in alerts:
              text = msg.get("text", "")
              cases = re.findall(r'\b4[67]\d{7}\b', text)
              if cases:
                  case_msgs.append(msg)
                  ts = msg.get("ts")
                  if ts:
                      replies = fetch_thread("C02K54WLXM2", ts)
                      threads[ts] = replies
                      print(f"  Case {cases[0]}: {len(replies)} thread replies")

          print(f"PD alert messages: {len(case_msgs)}")

          eod_msgs = fetch_channel("C079QNQQTFC", eod_oldest, eod_latest, limit=20)
          print(f"EOD: {len(eod_msgs)} messages")

          output = {
              "alerts": alerts,
              "alert_threads": threads,
              "eod_messages": eod_msgs
          }
          with open("slack_data.json", "w") as f:
              json.dump(output, f, indent=2)
          print("Saved slack_data.json")
          PYEOF

      - name: Upload Slack data
        uses: actions/upload-artifact@v4
        with:
          name: slack-data-today
          path: slack_data.json
          retention-days: 1
