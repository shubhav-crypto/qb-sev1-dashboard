name: Temp Slack Fetch

on:
  workflow_dispatch:
    inputs:
      oldest:
        description: 'oldest unix timestamp'
        required: true
        default: '1793948400'
      latest:
        description: 'latest unix timestamp'
        required: true
        default: '1793973600'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Slack data
        run: |
          python3 << 'EOF'
          import requests, json

          token = "${{ secrets.SLACK_USER_TOKEN }}"
          oldest = "${{ github.event.inputs.oldest }}"
          latest = "${{ github.event.inputs.latest }}"
          
          headers = {"Authorization": f"Bearer {token}"}
          
          # Fetch alerts channel
          resp = requests.get(
            "https://slack.com/api/conversations.history",
            headers=headers,
            params={
              "channel": "C02K54WLXM2",
              "oldest": oldest,
              "latest": latest,
              "limit": 100
            }
          )
          alerts_data = resp.json()
          
          # Save alerts
          with open("alerts.json", "w") as f:
            json.dump(alerts_data, f)
          
          # Fetch EOD channel
          resp2 = requests.get(
            "https://slack.com/api/conversations.history",
            headers=headers,
            params={
              "channel": "C079QNQQTFC",
              "oldest": "1793971800",
              "latest": "1793991599",
              "limit": 20
            }
          )
          eod_data = resp2.json()
          
          with open("eod.json", "w") as f:
            json.dump(eod_data, f)
          
          # Summary
          msgs = alerts_data.get("messages", [])
          print(f"Alerts: {len(msgs)} messages")
          print(f"EOD: {len(eod_data.get('messages', []))} messages")
          EOF

      - name: Upload Slack data
        uses: actions/upload-artifact@v4
        with:
          name: slack-data
          path: |
            alerts.json
            eod.json
          retention-days: 1
